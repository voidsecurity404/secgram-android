name: Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Clone.
        uses: actions/checkout@v4

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false

      - name: Java.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android SDK and NDK.
        run: |
          yes | "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018" "cmake;3.22.1" \
            "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Signing key.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
            echo "VARIANT=Release" >> $GITHUB_ENV
          else
            # No private key yet: a debug build only to check that it compiles.
            echo "::warning::KEYSTORE_BASE64 is not set, building a test debug APK"
            echo "VARIANT=Debug" >> $GITHUB_ENV
          fi

      - name: Build.
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          SIGNING=""
          if [ "$VARIANT" = "Release" ]; then
            SIGNING="-PRELEASE_KEY_ALIAS=secgram -PRELEASE_KEY_PASSWORD=$KEYSTORE_PASSWORD -PRELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
          fi
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g \
            :TMessagesProj_App:assembleAfat$VARIANT \
            -PSECGRAM_APP_ID="${API_ID:-0}" \
            -PSECGRAM_APP_HASH="$API_HASH" \
            $SIGNING

      - name: Package.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="dev-${GITHUB_SHA::7}";; esac
          mkdir -p dist
          APK=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -1)
          SUFFIX=""
          [ "$VARIANT" = "Debug" ] && SUFFIX="-TEST-DEBUG"
          cp "$APK" "dist/SecGram-$VERSION-android-universal$SUFFIX.apk"
          rm -f TMessagesProj/config/release.keystore
          ls -la dist

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: SecGram-android
          path: dist/
          retention-days: 7

      - name: Release.
        if: startsWith(github.ref, 'refs/tags/') && env.VARIANT == 'Release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
